<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Your Ride</title>
  <link rel="stylesheet" href="m.css">
</head>
<body>
<div class="booking-wrapper">
  <div class="form-card">
    <h2>📋 Book Lamborghini</h2>
    <p class="price">850 LE <span>/ day</span></p>
    <input type="text" id="name" placeholder="Full name">
    <input type="email" id="email" placeholder="Email address">
    <input type="tel" id="phone" placeholder="Phone (10-11 digits)">
    <div class="date-row">
      <input type="date" id="pickup">
      <input type="date" id="return">
    </div>
    <button id="bookBtn">✓ CONFIRM BOOKING</button>
    <div id="msg" class="message"></div>
  </div>
  <div class="summary-card">
    <h2>💰 Summary</h2>
    <div class="summary-row"><span>📅 Rental days</span><span id="days">0</span></div>
    <div class="summary-row"><span>🚗 Daily rate</span><span>850 LE</span></div>
    <div class="summary-row"><span>📝 Subtotal</span><span id="sub">0.00</span> LE</div>
    <div class="summary-row"><span>🔧 Tax (8%)</span><span id="tax">0.00</span> LE</div>
    <div class="summary-row total"><span>💰 TOTAL</span><span id="total">0.00</span> LE</div>
  </div>
</div>
<script src="m.js"></script>
</body>
</html>
