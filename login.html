<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVX | Secure Portal</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <section id="login-view" class="auth-page">
    <div class="glass-box">
      <div class="logo">
        <span class="logo-rev">Own The Road</span>
      </div>
      <h2 id="auth-title">LOGIN</h2>
      
      <div id="msg-box" class="msg-box hid"></div>

      <form id="auth-form">
        <div class="input-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div id="signup-fields" class="hid">
          <input type="text" id="phone" placeholder="Phone Number">
        </div>

        <div class="input-group pass-wrapper">
          <input type="password" id="password" placeholder="Password" required>
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>

        <div id="confirm-fields" class="hid">
          <input type="password" id="confirm-password" placeholder="Confirm Password">
        </div>

        <button type="submit" class="btn" id="submit-btn">LOGIN</button>
        <p id="switch-auth">New here? <span>Create Account</span></p>
      </form>
    </div>
  </section>

  <div id="dashboard-view" class="dash-container hid">
    <nav class="sidebar">
      <div class="logo">REV<span>X</span></div>
      <ul class="nav-list">
        <li class="nav-item active" data-tab="tab-home">
          <i class="fa-solid fa-house"></i> Home
        </li>
        <li class="nav-item" data-tab="tab-bookings">
          <i class="fa-solid fa-calendar-check"></i> Bookings
        </li>
        <li class="nav-item" data-tab="tab-profile">
          <i class="fa-solid fa-user"></i> Profile
        </li>
        <li class="logout-btn" id="logout-trigger">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </li>
      </ul>
    </nav>
    
    <main class="main-content">
      <section id="tab-home" class="tab-content">
        <h1>Welcome, <span id="user-display">Driver</span></h1>
        <div class="stats-grid">
          <div class="stat-card"><h3>Active Rents</h3><p>2</p></div>
          <div class="stat-card"><h3>Points</h3><p>450</p></div>
          <div class="stat-card"><h3>Balance</h3><p>$1,200</p></div>
        </div>
      </section>

      <section id="tab-bookings" class="tab-content hid">
        <h2>Recent Bookings</h2>
        <div class="list-item">
          <p><strong>Tesla Model S</strong> - Oct 2026</p>
          <span class="status-tag">Confirmed</span>
        </div>
      </section>

      <section id="tab-profile" class="tab-content hid">
        <h2>Account Profile</h2>
        <div class="profile-card">
          <p><strong>Email:</strong> <span id="prof-email"></span></p>
          <p><strong>Phone:</strong> <span id="prof-phone"></span></p>
          <button class="action-btn">Edit Settings</button>
        </div>
      </section>
    </main>
  </div>

  <script src="login.js"></script>
</body>
</html>
